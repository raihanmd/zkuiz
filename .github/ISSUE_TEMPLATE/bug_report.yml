name: Bug report
description: Report a problem with the project or its documentation.
title: "bug: "
body:
  - type: markdown
    attributes:
      value: |
        For security vulnerabilities, use the private reporting link instead of a public issue.
  - type: textarea
    id: problem
    attributes:
      label: What went wrong?
      description: Describe what you observed and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include a minimal example, affected file, or relevant link.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Commit or version
      description: Which revision were you using?
